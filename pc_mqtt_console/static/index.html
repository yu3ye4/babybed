<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BabyBed MQTT Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --line: #d7dde5;
      --accent: #0f766e;
      --danger: #c2410c;
      --warn: #b45309;
      --ok: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    main {
      padding: 20px 24px 28px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.on { background: var(--ok); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .metric-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .metric-value {
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
    }
    .metric-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      min-height: 16px;
    }
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button.secondary {
      background: white;
      color: var(--accent);
    }
    input, select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: #f8fafc;
    }
    .raw {
      max-width: 520px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .analysis {
      min-height: 120px;
      line-height: 1.6;
      font-size: 14px;
    }
    .analysis h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    .analysis ul {
      margin: 6px 0 12px;
      padding-left: 18px;
    }
    .analysis .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .breath-panel {
      margin-top: 12px;
    }
    .breath-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .breath-metrics {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .breath-metric {
      min-width: 96px;
    }
    .breath-metric strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }
    .breath-chart {
      width: 100%;
      height: 260px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfdff;
    }
    .vision-preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f172a;
    }
    .vision-preview-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .risk0 { color: var(--ok); }
    .risk1 { color: var(--warn); }
    .risk2, .risk3 { color: var(--danger); }
    @media (max-width: 900px) {
      header { padding: 0 14px; }
      main { padding: 14px; }
      .grid, .layout { grid-template-columns: 1fr; }
      .metric-value { font-size: 24px; }
      .breath-chart { height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>BabyBed MQTT Console</h1>
    <div class="header-right">
      <button id="langToggle" class="secondary" onclick="toggleLang()">English</button>
      <div class="status"><span id="mqttDot" class="dot"></span><span id="mqttText">MQTT 未连接</span></div>
    </div>
  </header>

  <main>
    <section class="grid">
      <div class="panel">
        <div class="metric-label" data-i18n="temperature">温度</div>
        <div id="temp" class="metric-value">--</div>
        <div class="metric-sub" data-i18n="celsius">摄氏度</div>
      </div>
      <div class="panel">
        <div class="metric-label" data-i18n="humidity">湿度</div>
        <div id="humi" class="metric-value">--</div>
        <div class="metric-sub" data-i18n="percent">百分比</div>
      </div>
      <div class="panel">
        <div class="metric-label" data-i18n="riskLevel">风险等级</div>
        <div id="risk" class="metric-value">--</div>
        <div id="score" class="metric-sub">score --</div>
      </div>
      <div class="panel">
        <div class="metric-label" data-i18n="visionStatus">视觉状态</div>
        <div id="vision" class="metric-value">--</div>
        <div id="visionDetail" class="metric-sub">confidence -- risk --</div>
        <div id="face" class="metric-sub">face --</div>
      </div>
    </section>

    <section class="panel breath-panel">
      <div class="breath-head">
        <div>
          <strong data-i18n="breathWaveform">呼吸波形</strong>
          <div id="breathMeta" class="metric-sub">waiting for breath data</div>
        </div>
        <div class="breath-metrics">
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathBase">基线</div>
            <strong id="breathBase">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathPeak">峰峰值</div>
            <strong id="breathPp">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathFilteredPeak">滤波峰峰值</div>
            <strong id="breathFilteredPp">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathEnergy">能量</div>
            <strong id="breathEnergy">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathPeriodic">周期</div>
            <strong id="breathPeriodic">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathMotionCount">波动数</div>
            <strong id="breathMotionCount">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathActive">活动</div>
            <strong id="breathActive">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathApnea">无呼吸</div>
            <strong id="breathApnea">--</strong>
          </div>
          <div class="breath-metric">
            <div class="metric-label" data-i18n="breathState">状态</div>
            <strong id="breathState">--</strong>
          </div>
        </div>
      </div>
      <canvas id="breathCanvas" class="breath-chart"></canvas>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
          <strong data-i18n="cameraPreview">摄像头画面</strong>
          <button class="secondary" onclick="refresh()" data-i18n="refresh">刷新</button>
        </div>
        <img id="visionPreview" class="vision-preview" alt="PC camera preview">
        <div id="visionPreviewMeta" class="vision-preview-meta">
          <span>posture --</span>
          <span>confidence --</span>
          <span>risk --</span>
          <span>stable --</span>
        </div>
      </div>

      <div>
        <div class="panel">
          <div style="font-weight: 700; margin-bottom: 12px;" data-i18n="thresholdCommand">阈值命令</div>
          <div class="row">
            <select id="cmdKey">
              <option value="temp_min">temp_min</option>
              <option value="temp_max">temp_max</option>
              <option value="humi_min">humi_min</option>
              <option value="humi_max">humi_max</option>
            </select>
            <input id="cmdValue" type="number" step="0.1" value="30.0" style="width: 110px;">
            <button onclick="sendThreshold()" data-i18n="send">发送</button>
          </div>
          <div id="cmdResult" class="metric-sub"></div>
        </div>

        <div class="panel" style="margin-top: 12px;">
          <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
            <strong data-i18n="aiAnalysis">AI 分析</strong>
            <button onclick="runAnalysis()" data-i18n="analyze">分析</button>
          </div>
          <div id="analysis" class="analysis" data-i18n="noAnalysis">暂无分析结果</div>
          <div id="analysisMeta" class="metric-sub"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const i18n = {
      zh: {
        langButton: "English",
        mqttConnected: "MQTT 已连接",
        mqttDisconnected: "MQTT 未连接",
        temperature: "温度",
        celsius: "摄氏度",
        humidity: "湿度",
        percent: "百分比",
        riskLevel: "风险等级",
        visionStatus: "视觉状态",
        cameraPreview: "摄像头画面",
        history: "Telemetry 历史",
        refresh: "刷新",
        time: "时间",
        risk: "风险",
        vision: "视觉",
        rawData: "原始数据",
        thresholdCommand: "阈值命令",
        send: "发送",
        sending: "发送中...",
        sent: "已发送",
        sendFailed: "发送失败",
        aiAnalysis: "AI 分析",
        analyze: "分析",
        analyzing: "分析中...",
        analysisFailed: "分析失败",
        noAnalysis: "暂无分析结果",
        summary: "风险摘要",
        causes: "可能原因",
        actions: "建议操作",
        breathWaveform: "呼吸波形",
        breathBase: "基线",
        breathPeak: "峰峰值",
        breathFilteredPeak: "滤波峰峰值",
        breathEnergy: "能量",
        breathPeriodic: "周期",
        breathMotionCount: "波动数",
        breathActive: "活动",
        breathApnea: "无呼吸",
        breathState: "状态"
      },
      en: {
        langButton: "中文",
        mqttConnected: "MQTT connected",
        mqttDisconnected: "MQTT disconnected",
        temperature: "Temperature",
        celsius: "Celsius",
        humidity: "Humidity",
        percent: "Percent",
        riskLevel: "Risk Level",
        visionStatus: "Vision Status",
        cameraPreview: "Camera Preview",
        history: "Telemetry History",
        refresh: "Refresh",
        time: "Time",
        risk: "Risk",
        vision: "Vision",
        rawData: "Raw Data",
        thresholdCommand: "Threshold Command",
        send: "Send",
        sending: "Sending...",
        sent: "Sent",
        sendFailed: "Send failed",
        aiAnalysis: "AI Analysis",
        analyze: "Analyze",
        analyzing: "Analyzing...",
        analysisFailed: "Analysis failed",
        noAnalysis: "No analysis yet",
        summary: "Risk Summary",
        causes: "Likely Causes",
        actions: "Suggested Actions",
        breathWaveform: "Breath Waveform",
        breathBase: "Base",
        breathPeak: "Peak-to-peak",
        breathFilteredPeak: "Filtered P-P",
        breathEnergy: "Energy",
        breathPeriodic: "Periodic",
        breathMotionCount: "Motion Count",
        breathActive: "Active",
        breathApnea: "Apnea",
        breathState: "State"
      }
    };
    let lang = localStorage.getItem("babybed_lang") || "zh";

    function t(key) {
      return (i18n[lang] && i18n[lang][key]) || i18n.zh[key] || key;
    }

    function applyLang() {
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.getElementById("langToggle").textContent = t("langButton");
      refresh();
      refreshBreath();
    }

    function toggleLang() {
      lang = lang === "zh" ? "en" : "zh";
      localStorage.setItem("babybed_lang", lang);
      applyLang();
    }

    function fmtTime(ts) {
      if (!ts) return "--";
      return new Date(ts * 1000).toLocaleTimeString();
    }

    function value(data, key) {
      return data && data[key] !== undefined ? data[key] : "--";
    }

    function riskClass(risk) {
      const n = Number(risk || 0);
      if (n >= 2) return "risk2";
      if (n === 1) return "risk1";
      return "risk0";
    }

    function smoothValues(values, radius) {
      return values.map((value, index) => {
        if (!Number.isFinite(value)) return value;
        let sum = 0;
        let count = 0;
        for (let i = Math.max(0, index - radius); i <= Math.min(values.length - 1, index + radius); i++) {
          if (Number.isFinite(values[i])) {
            sum += values[i];
            count += 1;
          }
        }
        return count > 0 ? sum / count : value;
      });
    }

    function drawBreath(points, latest) {
      const canvas = document.getElementById("breathCanvas");
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(180, Math.floor(rect.height));

      if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
      }

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fbfdff";
      ctx.fillRect(0, 0, width, height);

      const pad = {left: 48, right: 14, top: 16, bottom: 28};
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;

      ctx.strokeStyle = "#d7dde5";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + (plotH * i / 4);
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
      }
      ctx.stroke();

      if (!points || points.length < 2) {
        ctx.fillStyle = "#64748b";
        ctx.font = "13px Arial";
        ctx.fillText("waiting for breath data", pad.left, pad.top + 24);
        return;
      }

      const base = latest && Number.isFinite(Number(latest.base_mv)) ? Number(latest.base_mv) : Number(points[0].mv);
      const rawValues = points.map(p => Number(p.mv) - base).filter(Number.isFinite);
      const filteredValues = points
        .map(p => p.filtered_mv === null || p.filtered_mv === undefined ? null : Number(p.filtered_mv))
        .filter(Number.isFinite);
      const filteredForDraw = smoothValues(points.map(p =>
        p.filtered_mv === null || p.filtered_mv === undefined ? NaN : Number(p.filtered_mv)
      ), 2);
      const allValues = rawValues.concat(filteredValues);
      const maxAbs = Math.max(20, ...allValues.map(v => Math.abs(v)));
      const scaleAbs = Math.ceil(maxAbs * 1.15);
      const min = -scaleAbs;
      const max = scaleAbs;

      ctx.fillStyle = "#64748b";
      ctx.font = "12px Arial";
      ctx.fillText(`${max} mV`, 6, pad.top + 4);
      ctx.fillText(`${min} mV`, 6, height - pad.bottom + 4);
      ctx.fillText("0", 26, pad.top + plotH / 2 + 4);

      const zeroY = pad.top + plotH / 2;
      ctx.strokeStyle = "#94a3b8";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(pad.left, zeroY);
      ctx.lineTo(width - pad.right, zeroY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = "#9ca3af";
      ctx.lineWidth = 1;
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = pad.left + (plotW * index / (points.length - 1));
        const raw = Number(point.mv) - base;
        const y = pad.top + plotH - ((raw - min) * plotH / (max - min));
        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();

      ctx.strokeStyle = "#0f766e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      let hasFiltered = false;
      points.forEach((point, index) => {
        const filtered = filteredForDraw[index];
        if (!Number.isFinite(filtered)) {
          return;
        }
        const x = pad.left + (plotW * index / (points.length - 1));
        const y = pad.top + plotH - ((filtered - min) * plotH / (max - min));
        if (!hasFiltered) {
          ctx.moveTo(x, y);
          hasFiltered = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();

      ctx.fillStyle = "#64748b";
      ctx.fillText(`${points.length} pts, raw-base gray, filtered green`, pad.left, height - 8);
    }

    async function refreshBreath() {
      try {
        const body = await fetch("/api/breath?limit=500").then(r => r.json());
        const latest = body.latest;
        const points = Array.isArray(body.points) ? body.points : [];

        document.getElementById("breathBase").textContent =
          latest && latest.base_mv !== null && latest.base_mv !== undefined ? `${latest.base_mv} mV` : "--";
        document.getElementById("breathPp").textContent =
          latest && latest.pp_mv !== null && latest.pp_mv !== undefined ? `${latest.pp_mv} mV` : "--";
        document.getElementById("breathFilteredPp").textContent =
          latest && latest.filtered_pp_mv !== null && latest.filtered_pp_mv !== undefined ? `${latest.filtered_pp_mv} mV` : "--";
        document.getElementById("breathEnergy").textContent =
          latest && latest.energy_mv !== null && latest.energy_mv !== undefined ? `${latest.energy_mv} mV` : "--";
        document.getElementById("breathPeriodic").textContent = latest ? (latest.periodic ? "1" : "0") : "--";
        document.getElementById("breathPeriodic").className = latest && latest.periodic ? "risk0" : "risk1";
        document.getElementById("breathMotionCount").textContent =
          latest && latest.motion_count !== null && latest.motion_count !== undefined ? latest.motion_count : "--";
        document.getElementById("breathActive").textContent = latest ? (latest.active ? "1" : "0") : "--";
        document.getElementById("breathActive").className = latest && latest.active ? "risk2" : "risk0";
        document.getElementById("breathApnea").textContent =
          latest && latest.apnea_seconds !== null && latest.apnea_seconds !== undefined ? `${latest.apnea_seconds}s` : "--";
        document.getElementById("breathState").textContent = latest && latest.state ? latest.state : "--";
        document.getElementById("breathState").className =
          latest && latest.state === "apnea_suspect" ? "risk2" :
          latest && latest.state === "weak_or_missing" ? "risk1" : "risk0";
        document.getElementById("breathMeta").textContent = latest
          ? `${points.length} points, ${fmtTime(latest.recv_time)}`
          : "waiting for breath data";

        drawBreath(points, latest);
      } catch (err) {
        document.getElementById("breathMeta").textContent = "breath data unavailable";
        drawBreath([], null);
      }
    }

    function renderAnalysis(analysis) {
      const box = document.getElementById("analysis");
      if (!analysis) {
        box.textContent = t("noAnalysis");
        return;
      }
      const s = analysis.structured;
      if (!s) {
        box.textContent = analysis.text || t("noAnalysis");
        return;
      }
      const causes = Array.isArray(s.likely_causes) ? s.likely_causes : [];
      const actions = Array.isArray(s.parent_actions) ? s.parent_actions : [];
      box.innerHTML = `
        <span class="badge">${s.urgency || "unknown"}</span>
        <h3>${t("summary")}</h3>
        <div>${s.risk_summary || ""}</div>
        <h3 style="margin-top: 12px;">${t("causes")}</h3>
        <ul>${causes.map(item => `<li>${item}</li>`).join("")}</ul>
        <h3>${t("actions")}</h3>
        <ul>${actions.map(item => `<li>${item}</li>`).join("")}</ul>
        <div class="metric-sub">${s.disclaimer || ""}</div>
      `;
    }

    async function refresh() {
      const status = await fetch("/api/status").then(r => r.json());
      const dot = document.getElementById("mqttDot");
      dot.classList.toggle("on", status.mqtt_connected);
      document.getElementById("mqttText").textContent =
        status.mqtt_connected ? `${t("mqttConnected")} ${status.mqtt_host}:${status.mqtt_port}` : t("mqttDisconnected");

      const latest = status.latest;
      const data = latest ? latest.data : {};
      document.getElementById("temp").textContent = value(data, "temp");
      document.getElementById("humi").textContent = value(data, "humi");
      document.getElementById("risk").textContent = latest ? latest.risk : "--";
      document.getElementById("risk").className = "metric-value " + riskClass(latest ? latest.risk : 0);
      document.getElementById("score").textContent = latest ? `score ${latest.score}` : "score --";
      const posture = value(data, "vision_posture");
      const visionConfidence = value(data, "vision_confidence");
      const visionRisk = value(data, "vision_risk");
      document.getElementById("vision").textContent = posture !== "--" ? posture : value(data, "vision");
      document.getElementById("visionDetail").textContent = `confidence ${visionConfidence}% risk ${visionRisk}`;
      document.getElementById("visionDetail").className = "metric-sub " + riskClass(visionRisk);
      document.getElementById("face").textContent =
        `vision ${value(data, "vision")} face ${value(data, "face")} stable ${value(data, "face_stable")}`;

      const preview = document.getElementById("visionPreview");
      const previewUrl = status.vision_preview_url || "";
      if (previewUrl && preview.dataset.src !== previewUrl) {
        preview.src = previewUrl;
        preview.dataset.src = previewUrl;
      }
      document.getElementById("visionPreviewMeta").innerHTML = `
        <span>posture ${posture}</span>
        <span>confidence ${visionConfidence}%</span>
        <span class="${riskClass(visionRisk)}">risk ${visionRisk}</span>
        <span>stable ${value(data, "face_stable")}</span>
      `;

      if (status.analysis) {
        renderAnalysis(status.analysis);
        document.getElementById("analysisMeta").textContent =
          status.analysis.created_at ? `${status.analysis.mode} · ${fmtTime(status.analysis.created_at)}` : "";
      }
    }

    async function sendThreshold() {
      const key = document.getElementById("cmdKey").value;
      const value = Number(document.getElementById("cmdValue").value);
      const result = document.getElementById("cmdResult");
      result.textContent = t("sending");
      const res = await fetch("/api/command/threshold", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key, value})
      });
      const body = await res.json();
      result.textContent = res.ok ? `${t("sent")} ${body.payload}` : `${t("sendFailed")} ${body.detail || res.status}`;
    }

    async function runAnalysis() {
      const panel = document.getElementById("analysis");
      panel.textContent = t("analyzing");
      const res = await fetch(`/api/analyze?lang=${encodeURIComponent(lang)}`, {method: "POST"});
      const body = await res.json();
      if (res.ok) {
        renderAnalysis(body);
      } else {
        panel.textContent = body.detail || t("analysisFailed");
      }
      document.getElementById("analysisMeta").textContent = body.created_at ? `${body.mode} · ${fmtTime(body.created_at)}` : "";
    }

    applyLang();
    setInterval(refresh, 2000);
    setInterval(refreshBreath, 1000);
  </script>
</body>
</html>
